[workspace]
resolver = "3"
members = ["firmware", "media-engine", "media-protocol"]

[workspace.dependencies]
base64 = { version = "0.23.1", default-features = false }
bytes = "1.12.1"
hmac = { version = "0.13.0", default-features = false }
# `settimeofday` for the SNTP clock sync; libc is already in the tree via tokio.
libc = "0.2.191"
md-5 = { version = "0.11.0", default-features = false }
# mDNS responder for the camera's own name and its RTSP service. No async
# receivers or log bridge are needed, so both default features are off.
mdns-sd = { version = "0.21.6", default-features = false }
memchr = { version = "2.8.3", default-features = false }
rand = { version = "0.10.3", default-features = false }
# Self-signed certificate generation for first boot. Pure Rust and reuses the
# ring provider already selected for rustls, so no second crypto stack is added.
rcgen = { version = "0.14.10", default-features = false }
roxmltree = "0.21.2"
rtp = "0.17.2"
rtsp-runtime = "0.7.1"
rtsp-types = "0.1.3"
# MQTT client. The rustls mode without a provider is used so that the ring provider
# already in the tree serves TLS here too, rather than adding AWS-LC.
rumqttc = { version = "0.25.1", default-features = false }
# Select ring only; the default AWS-LC provider needs a separate cross toolchain.
rustls = { version = "0.23.46", default-features = false }
rustls-pki-types = { version = "1.15.1", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
time = "0.3.55"
tokio = "1.54.1"
tokio-rustls = { version = "0.26.6", default-features = false }
tracing = { version = "0.1.44", default-features = false }
# The daemon writes plain log lines; ANSI formatting and tracing attributes are unused.
tracing-subscriber = { version = "0.3.23", default-features = false }
zeroize = "1.9.1"

# The camera-side daemon is size-constrained and delegates capture to the
# no_std Rust media engine and the board's vendor libraries.
# Fat LTO removes unused Rust monomorphizations; aborting panics is appropriate
# for this supervisor-managed service and avoids carrying unwind machinery.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
