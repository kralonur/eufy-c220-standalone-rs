[package]
name = "c220-media-engine"
version = "0.1.0"
edition = "2024"

[features]
# Link the device paths. Off by default because the vendor libraries' own
# constructors fault where the camera's hardware is absent, which makes a
# hardware build impossible to start under an emulator; a build without this
# feature still serves the whole daemon protocol.
hardware = []

[dependencies]
# Shared camera-local media framing; the engine only needs the header and the
# record kinds, because a record's payload is interpreted in place.
c220-media-protocol = { path = "../media-protocol" }
# The workspace default features are fine here: libc's `std` feature only selects
# link attributes and the crate never references `std`, so it cannot put a
# thread-local segment in this binary (see the crate documentation).
libc = { workspace = true }
