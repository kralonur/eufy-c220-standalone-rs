[package]
name = "c220-firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
# Shared camera-local media framing, also used by the no_std media engine.
c220-media-protocol = { path = "../media-protocol" }
hmac = { workspace = true }
libc = { workspace = true }
md-5 = { workspace = true }
mdns-sd = { workspace = true }
rcgen = { workspace = true }
rtp = { workspace = true }
rtsp-runtime = { workspace = true, features = ["tokio"] }
rtsp-types = { workspace = true }
rumqttc = { workspace = true }
rustls = { workspace = true, features = ["ring", "std"] }
rustls-pki-types = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["ring"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
